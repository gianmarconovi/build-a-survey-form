<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo di Sondaggio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">Sondaggio di Valutazione</h1>
            <p id="description">Grazie per dedicare qualche minuto alla compilazione del modulo</p>
        </header>
        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name">Nome</label>
                <input type="text" id="name" placeholder="Inserisci il tuo nome" required>
            </div>
            
            <div class="form-group">
                <label id="email-label" for="email">Email</label>
                <input type="email" id="email" placeholder="Inserisci la tua email" required>
            </div>
            
            <div class="form-group">
                <label id="number-label" for="number">Età (opzionale)</label>
                <input type="number" id="number" min="10" max="99" placeholder="Età">
            </div>
            
            <div class="form-group">
                <p>Quale opzione descrive meglio la tua occupazione attuale?</p>
                <select id="dropdown" required>
                    <option disabled selected value="">Seleziona un'opzione</option>
                    <option value="student">Studente</option>
                    <option value="job">Lavoro a tempo pieno</option>
                    <option value="learner">Studente a tempo pieno</option>
                    <option value="other">Altro</option>
                </select>
            </div>
            
            <div class="form-group">
                <p>Consiglieresti questo percorso a un amico?</p>
                <label>
                    <input type="radio" name="recommend" value="definitely" checked> Sicuramente
                </label>
                <label>
                    <input type="radio" name="recommend" value="maybe"> Forse
                </label>
                <label>
                    <input type="radio" name="recommend" value="not-sure"> Non sono sicuro
                </label>
            </div>
            
            <div class="form-group">
                <p>Cosa vorresti vedere migliorato? (Seleziona tutte le opzioni valide)</p>
                <label>
                    <input type="checkbox" name="prefer" value="front-end"> Progetti Front-end
                </label>
                <label>
                    <input type="checkbox" name="prefer" value="back-end"> Progetti Back-end
                </label>
                <label>
                    <input type="checkbox" name="prefer" value="data-visualization"> Visualizzazione Dati
                </label>
                <label>
                    <input type="checkbox" name="prefer" value="community"> Comunità open source
                </label>
            </div>
            
            <div class="form-group">
                <p>Commenti o suggerimenti?</p>
                <textarea id="comments" name="comment" placeholder="Scrivi qui i tuoi commenti..."></textarea>
            </div>
            
            <div class="form-group">
                <button type="submit" id="submit">Invia</button>
            </div>
        </form>
    </div>
</body>
</html>
